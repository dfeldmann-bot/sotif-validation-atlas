<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>SOTIF Validation Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=IBM+Plex+Sans+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Math&display=swap">
<style>
/* Layout: full-screen pan/zoom canvas on a dot grid. Top: Requirement. Centre: the unknown rate R.
   Middle: World | System (the two factors of R = Σ λ·p). Below: Evidence. Right: Inference.
   Bottom: Mathematical foundations, the bedrock every step stands on, linked upward by dotted lines.
   Symbol colours encode meaning everywhere. Robotaxi example values sit on every card. Course design system (sinadra). */
:root{
  --paper:#f6f7f5; --ink:#1a2220; --ink-soft:#4a5654; --ink-mute:#7d8986; --rule:#d5dbd8; --panel:#ebefed; --card:#ffffff; --dot:#cdd5d2;
  --c-req:#0e6b63; --c-world:#2563a6; --c-sys:#7444b3; --c-test:#3d7a1f; --c-conf:#b0306f; --c-risk:#1a2220; --c-math:#5d5a52; --c-hara:#7a5a1e; --c-scen:#2f6f73;
  --c-ex:#a8551c; --caution:#a8551c; --good:#1f7a3d; --bad:#b3261e;
  --serif:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --label:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --math:"STIX Two Math","Cambria Math","Latin Modern Math","Noto Sans Math",math;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121816; --ink:#e3e9e6; --ink-soft:#a3b0ac; --ink-mute:#73807c; --rule:#2c3734; --panel:#1b2421; --card:#18201d; --dot:#27312e;
  --c-req:#4fb8ad; --c-world:#74a9e8; --c-sys:#b593ee; --c-test:#8cc46a; --c-conf:#ec7fb2; --c-risk:#e3e9e6; --c-math:#c9c3b2; --c-hara:#d4b06a; --c-scen:#7cc4c8;
  --c-ex:#e0954f; --caution:#e0954f; --good:#63c283; --bad:#f08a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121816; --ink:#e3e9e6; --ink-soft:#a3b0ac; --ink-mute:#73807c; --rule:#2c3734; --panel:#1b2421; --card:#18201d; --dot:#27312e;
  --c-req:#4fb8ad; --c-world:#74a9e8; --c-sys:#b593ee; --c-test:#8cc46a; --c-conf:#ec7fb2; --c-risk:#e3e9e6; --c-math:#c9c3b2; --c-hara:#d4b06a; --c-scen:#7cc4c8;
  --c-ex:#e0954f; --caution:#e0954f; --good:#63c283; --bad:#f08a80; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--serif);overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
math{font-family:var(--math)}
.cat-req{color:var(--c-req)} .cat-world{color:var(--c-world)} .cat-sys{color:var(--c-sys)} .cat-test{color:var(--c-test)} .cat-conf{color:var(--c-conf)} .cat-risk{color:var(--c-risk)}
.sym{transition:background-color .15s;border-radius:3px}
.sym.hl{background-color:color-mix(in srgb,currentColor 18%,transparent)}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--rule);background:var(--paper);z-index:5}
.crumb{font:500 12px/1.2 var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
header h1{font-weight:600;font-size:21px;line-height:1.15;margin:0;letter-spacing:-.01em}
.tools{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
button,.btnlink{font:600 12px/1 var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--c-req);background:transparent;border:1px solid var(--c-req);border-radius:3px;padding:8px 11px;cursor:pointer;min-height:34px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.solid{background:var(--c-req);color:var(--paper)}
button[aria-pressed="true"]{background:color-mix(in srgb,var(--c-req) 14%,transparent)}
.btnlink{color:var(--c-ex);border-color:var(--c-ex)}
button:focus-visible,.node:focus-visible,.btnlink:focus-visible{outline:2px solid var(--c-req);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.stage{position:relative;flex:1;overflow:hidden;touch-action:none;cursor:grab;background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:26px 26px}
.stage.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.zone{position:absolute;border-radius:22px;border:1.5px dashed color-mix(in srgb,var(--zc) 45%,transparent);background:color-mix(in srgb,var(--zc) 6%,transparent)}
.zone .zl{position:absolute;left:22px;top:-14px;background:var(--paper);padding:2px 10px;font:600 15px/1.3 var(--label);letter-spacing:.07em;text-transform:uppercase;color:var(--zc);white-space:nowrap}
.zone .zd{position:absolute;left:26px;top:16px;font:italic 14px/1.3 var(--serif);color:var(--ink-soft);white-space:nowrap}
.z-req{--zc:var(--c-req)} .z-world{--zc:var(--c-world)} .z-sys{--zc:var(--c-sys)} .z-evi{--zc:var(--c-test)} .z-inf{--zc:var(--c-conf)} .z-risk{--zc:var(--c-risk)} .z-math{--zc:var(--c-math)} .z-hara{--zc:var(--c-hara)} .z-scen{--zc:var(--c-scen)}
.zone.z-math{border-style:solid;background:color-mix(in srgb,var(--c-math) 9%,transparent)}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.edges path{fill:none;stroke:var(--ink-mute);stroke-opacity:.55;stroke-width:1.6;transition:opacity .2s,stroke-width .2s}
svg.edges path.math{stroke:var(--c-math);stroke-opacity:.38;stroke-width:1.3;stroke-dasharray:2 5;stroke-linecap:round}
svg.edges path.hi{stroke:var(--ink);stroke-opacity:1;stroke-width:2.6}
svg.edges path.math.hi{stroke:var(--c-math);stroke-opacity:1;stroke-width:2.4;stroke-dasharray:3 5}
svg.edges path.dim{opacity:.12}
.world.nomath svg.edges path.math:not(.hi){display:none}
.elab{position:absolute;transform:translate(-50%,-50%);font-size:15px;background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:1px 9px;white-space:nowrap;pointer-events:none;transition:opacity .2s;text-align:center;line-height:1.3}
.elab .ev{display:none;font:500 11.5px/1.3 var(--mono);color:var(--c-ex)}
.world.ex .elab .ev{display:block}
.elab.math{display:none}
.elab.math.hi{display:block;border-color:var(--c-math)}
.elab.hi{border-color:var(--ink)} .elab.dim{opacity:.12}
.node{position:absolute;width:250px;background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:12px 14px 13px;cursor:pointer;transition:opacity .2s,box-shadow .2s;box-shadow:inset 0 4px 0 var(--zc)}
.node:hover{box-shadow:inset 0 4px 0 var(--zc),0 6px 18px rgba(0,0,0,.08)}
.node .kind{font:600 11px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--zc);margin-top:4px}
.node .nt{font-weight:600;font-size:18px;line-height:1.22;margin-top:5px;text-wrap:balance}
.node .nq{font-style:italic;font-size:14.5px;color:var(--ink-soft);line-height:1.35;margin-top:3px}
.node .nm{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);font-size:19px;text-align:center;overflow-x:auto}
.node .chip{display:none;margin-top:8px;font:500 12.5px/1.35 var(--mono);color:var(--c-ex);background:color-mix(in srgb,var(--c-ex) 9%,transparent);border-radius:4px;padding:5px 7px}
.node .chip b{font:600 10.5px/1 var(--label);letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:3px}
.world.ex .node .chip{display:block}
.node.sel{box-shadow:inset 0 4px 0 var(--zc),0 0 0 3px var(--zc)}
.node.dim{opacity:.22}
.node.risk{width:290px;border-width:2px;border-color:var(--ink)}
.node.risk .nm{font-size:24px}
.node.mathn{background:color-mix(in srgb,var(--c-math) 4%,var(--card))}
.world.far .nm,.world.far .elab,.world.far .zd,.world.far .chip{display:none!important}
.world.far .nt{font-size:28px}.world.far .nq{font-size:21px}.world.far .zone .zl{font-size:26px;top:-20px}
.panel{position:absolute;right:14px;top:14px;bottom:14px;width:min(440px,calc(100% - 28px));background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.14);display:flex;flex-direction:column;z-index:4;margin-right:env(safe-area-inset-right,0px)}
.ph{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 4px}
.ph .tag{font:600 12px/1 var(--label);letter-spacing:.08em;text-transform:uppercase;color:var(--zc)}
.ph h2{font-weight:600;font-size:24px;line-height:1.15;margin:6px 0 0;text-wrap:balance}
.ph .x{margin-left:auto;padding:6px 10px}
.pb{padding:2px 18px 18px;overflow-y:auto;min-height:0}
.dek{font-style:italic;color:var(--ink-soft);font-size:17px;line-height:1.4;margin:4px 0 12px}
.pb h3{font:600 12px/1.3 var(--label);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft);margin:20px 0 6px}
.pb p{margin:0 0 10px;max-width:62ch}
.who{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 13px/1.35 var(--label);color:var(--ink-soft);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:6px 0;margin:4px 0 6px}
.who b{font-weight:600;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin-right:4px}
.w{font-weight:600;border-radius:3px;cursor:help;transition:background-color .15s}
.w.hl{background-color:color-mix(in srgb,currentColor 16%,transparent)}
.disp{background:var(--panel);border-radius:4px;padding:14px 12px;font-size:21px;overflow-x:auto;text-align:center}
.disp.ex{font-size:17px;background:transparent;border:1px dashed var(--c-ex)}
.disp .sym{cursor:pointer}
.exbox{border-left:3px solid var(--c-ex);padding:.15rem 0 .15rem 12px;margin:6px 0 4px}
.exbox .exl{font:600 12px/1.3 var(--label);letter-spacing:.07em;text-transform:uppercase;color:var(--c-ex);margin-bottom:6px}
.exbox a{color:var(--c-ex);font:600 13px var(--label);letter-spacing:.03em}
table.syms{border-collapse:collapse;width:100%;font-size:14px}
table.syms td{padding:6px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
table.syms td:first-child{font-size:17px;white-space:nowrap;width:1%}
table.syms td.src{font:500 12px/1.35 var(--label);color:var(--ink-mute);letter-spacing:.02em;width:30%}
table.syms tr{cursor:pointer;transition:background-color .15s}
table.syms tr.hl{background:color-mix(in srgb,var(--rc) 12%,transparent)}
.assume{border-left:3px solid var(--caution);padding:.2rem 0 .2rem 12px;margin:16px 0}
.assume strong{display:block;font:600 12px/1 var(--label);letter-spacing:.07em;text-transform:uppercase;color:var(--caution);margin-bottom:6px}
.viz{border:1px solid var(--rule);border-radius:4px;background:var(--card);padding:10px 10px 12px;margin-top:6px}
.viz svg{width:100%;height:auto;display:block}
.viz .ctl{display:flex;align-items:center;gap:10px;margin-top:8px;font:500 13px var(--label);color:var(--ink-soft)}
.viz .ctl input[type=range]{flex:1;accent-color:var(--c-req)}
.viz .ctl output{font:500 13px var(--mono);color:var(--ink);min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
.viz .vout{font-size:14.5px;line-height:1.5;margin-top:8px}
.viz .vout b{font-family:var(--mono);font-weight:500;font-size:13.5px}
.viz .cap{font:500 12px/1.35 var(--label);color:var(--ink-mute);margin-top:6px;letter-spacing:.02em}
.conn{display:flex;flex-direction:column;gap:6px}
.conn button{display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font:500 14px var(--label);color:var(--ink);border-color:var(--rule);text-align:left;width:100%}
.conn .dot{width:9px;height:9px;border-radius:50%;background:var(--zc);flex:none}
.conn .cl{margin-left:auto;font-size:15px;font-family:var(--math)}
.tour{display:flex;gap:8px;align-items:center;padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--rule)}
.tour .ts{font:500 12px var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-mute);margin-right:auto}
.keygrid{display:grid;gap:12px}
.keycat{border-left:4px solid var(--rc);padding-left:10px}
.keycat .kn{font:600 13px var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--rc)}
.keycat .kd{font-style:italic;color:var(--ink-soft);font-size:14.5px}
.hint{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));font:500 12.5px var(--label);color:var(--ink-soft);background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:7px 13px;pointer-events:none;letter-spacing:.02em}
@media (max-width:760px){
  .panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:62%;border-radius:16px 16px 0 0;margin:0}
  .ph,.pb{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .crumb,.hint{display:none}
  header h1{font-size:18px}
}
.node .lv{float:right;font:500 10.5px/1 var(--label);letter-spacing:.04em;text-transform:none;color:var(--ink-mute)}
.lvtag{display:inline-block;font:600 11px/1 var(--label);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);border-radius:999px;padding:4px 8px;color:var(--ink-soft);margin-left:8px;vertical-align:2px}
.plainbox{background:color-mix(in srgb,var(--c-req) 7%,var(--paper));border-radius:6px;padding:12px 14px;font-size:16.5px;line-height:1.6;margin:4px 0 6px}
.mathlead{font:italic 14.5px/1.45 var(--serif);color:var(--ink-soft);margin:0 0 8px}
.primer table{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0 10px}
.primer td,.primer th{padding:5px 6px;border-bottom:1px solid var(--rule);text-align:left;vertical-align:top}
.primer th{font:600 12px var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
.primer td:first-child{font-family:var(--mono);font-size:13.5px;white-space:nowrap}
.primer .idea{border-left:3px solid var(--c-req);padding-left:12px;margin:14px 0}
.primer .idea b.h{display:block;font:600 13px/1.3 var(--label);letter-spacing:.05em;text-transform:uppercase;color:var(--c-req);margin-bottom:4px}
.primer dl{margin:6px 0}.primer dt{font-weight:600;margin-top:8px}.primer dd{margin:2px 0 0;color:var(--ink-soft)}
.node .isot{margin-top:6px;display:inline-block;font:600 10.5px/1 var(--label);letter-spacing:.06em;text-transform:uppercase;color:var(--c-req);border:1px solid color-mix(in srgb,var(--c-req) 50%,transparent);border-radius:999px;padding:3px 7px}
.world.far .isot{font-size:16px;padding:5px 10px}
.node .nsrc{margin-top:7px;font:500 11.5px/1.3 var(--label);color:var(--ink-mute);letter-spacing:.02em}
.world.far .nsrc{display:none}
ul.srcl{list-style:none;padding:0;margin:4px 0 6px;display:grid;gap:8px}
ul.srcl li{font-size:14.5px;line-height:1.45}
ul.srcl a{color:var(--c-req)}
.sst{display:inline-block;font:600 10.5px/1 var(--label);letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 7px;margin-right:7px;vertical-align:1px}
.sst-v{color:var(--good);border:1px solid var(--good)}
.sst-n{color:var(--ink-soft);border:1px solid var(--rule)}
.sst-o{color:var(--c-ex);border:1px solid var(--c-ex)}
.sfull{display:block;font:500 12px/1.4 var(--label);color:var(--ink-mute);margin-top:2px}
ol.lsteps{padding-left:1.4rem;margin:6px 0 0}
ol.lsteps li{margin:0 0 12px}
ol.lsteps li::marker{font:600 13px var(--label);color:var(--c-math)}
ol.lsteps p{margin:0 0 6px}
.disp.lsd{font-size:18px;padding:10px}
.check{border:1px solid var(--rule);border-radius:6px;padding:10px 12px;background:var(--card)}
.check details{margin-top:4px}.check summary{cursor:pointer;font:600 13px var(--label);letter-spacing:.04em;color:var(--c-req)}
.check details p{margin:8px 0 0}
.prelink{font:500 13px var(--label);text-transform:none;letter-spacing:0;padding:4px 9px;min-height:28px;color:var(--c-math);border-color:var(--c-math);margin:2px 4px 2px 0}
.primer .notation td:first-child{font-family:var(--math);font-size:17px}
.mpath{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header>
    <div>
      <div class="crumb"><a href="../README.md" style="color:inherit">SOTIF Risk Course</a> · Map</div>
      <h1>SOTIF Validation Atlas</h1>
    </div>
    <div class="tools">
      <a class="btnlink" href="robotaxi-crosswalk-example.html">Example page</a>
      <button id="startBtn" class="solid">Start here</button>
      <button id="tourBtn">ISO 21448 tour</button>
      <button id="exBtn" aria-pressed="true">Robotaxi values</button>
      <button id="mathBtn" aria-pressed="true">Maths links</button>
      <button id="keyBtn">Colours</button>
      <button id="fitBtn">Fit</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <button id="zoomIn" aria-label="Zoom in">+</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
const EXURL="robotaxi-crosswalk-example.html";
/* ---------- Symbol registry: one colour per kind of quantity, everywhere ---------- */
const CAT={
  req:{n:"Requirement",d:"What you demand of the car"},
  world:{n:"World",d:"How often reality presents things; measured on the road"},
  sys:{n:"System",d:"How your car behaves; measured by testing"},
  test:{n:"Test design",d:"Choices you make about how to test"},
  conf:{n:"Confidence",d:"How sure a claim is"},
  risk:{n:"Target quantity",d:"The true rate every claim is about"}
};
const R_=String.raw;
const SYM={
 RH:{t:"R_H",c:"risk",n:"True rate at which the car causes harm H",s:"Never observed, only bounded"},
 hped:{t:R_`h_{\text{ped}}`,c:"world",n:"Rate at which human drivers injure pedestrians in this ODD",s:"Human accident data matched to the ODD (synthetic placeholder here)"},
 AH:{t:"A_H",c:"req",n:"Acceptable rate of harm H, the acceptance criterion",s:"Benchmark × margin × share"},
 RHB:{t:"R_{HB}",c:"req",n:"Tolerable rate of the hazardous behaviour",s:"A_H ÷ chain (ISO 21448 C.2.1)"},
 PE:{t:R_`P(E\mid HB)`,c:"world",n:"Chance the pedestrian steps into the path during the behaviour",s:"Field data"},
 PC:{t:R_`P(\bar C\mid E)`,c:"world",n:"Chance the pedestrian cannot avoid the collision",s:"Field data, studies"},
 PS:{t:R_`P(S\mid \bar C)`,c:"world",n:"Chance the collision causes an injury",s:"Accident data"},
 R:{t:"R",c:"risk",n:"True rate of the hazardous behaviour, your car in its ODD",s:"Never observed, only bounded"},
 b:{t:"b_k",c:"req",n:"Budget share of logical scenario k",s:"Equal protection per encounter"},
 bu:{t:R_`b_{\text{unk}}`,c:"req",n:"Reserve for situations not yet in the catalogue",s:"10 % of R_HB"},
 B:{t:"B",c:"req",n:"Budget left for the known logical scenarios",s:"R_HB − b_unk"},
 h:{t:"h_k",c:"req",n:"Human-driver level in logical scenario k, as a behaviour rate",s:"Accident data per type"},
 lam:{t:R_`\lambda_k`,c:"world",n:"Exposure: encounters with logical scenario k per hour",s:"Field driving"},
 lamU:{t:R_`\lambda_k^{U}`,c:"world",n:"Upper confidence bound on the exposure",s:"Poisson bound on N_k and τ"},
 p:{t:"p_k",c:"sys",n:"Probability the car fails in one encounter of logical scenario k",s:"Tests"},
 pU:{t:R_`p_k^{U}`,c:"sys",n:"Upper confidence bound on the failure probability",s:"Zero-failure bound on sim runs"},
 pstar:{t:R_`p_k^{*}`,c:"req",n:"Allowed failure probability per encounter",s:"b_k / λ_kᵁ"},

const KEY={};let ki=1;

function tex(src,display=false){
  if(!window.katex)return `<code>${src}</code>`;
  const html=katex.renderToString(src,{output:"mathml",displayMode:display,throwOnError:false,strict:false});
  const t=document.createElement("template");t.innerHTML=html;
  t.content.querySelectorAll("[mathcolor]").forEach(m=>{const id=KEY[m.getAttribute("mathcolor").toLowerCase()];if(id){m.removeAttribute("mathcolor");m.setAttribute("class","sym cat-"+SYM[id].c);m.setAttribute("data-s",id);}});
  const d=document.createElement("div");d.appendChild(t.content);return d.innerHTML;
}

 {id:"R",z:"risk",x:870,y:700,risk:true,t:"Hazardous-behaviour rate",q:"The one number you never see",
  card:R_`${S("R")}=\sum_k ${S("lam")}\,${S("p")}`,
  big:R_`${S("R")}\;=\;\sum_{k} ${S("lam")}\cdot ${S("p")}`,
  words:`${W("lam","How often a situation happens")} times ${W("p","how often the car fails when it does")}, summed over logical scenarios.`,
  ex:R_`${S("R")}=4.0\,p_1+0.5\,p_2+0.3\,p_3\ \ \text{per hour}`,
  ev:"Bounded at 4.57·10⁻⁷ /h",exT:"Three logical scenarios: pedestrian in clear view, pedestrian emerging from behind a vehicle, robotaxi turning onto the crossing; plus unknown situations.",step:"s05",
  why:"The backbone of the map. The left factor belongs to the world and needs road data. The right factor belongs to the car and needs tests. That is why the canvas splits left and right below this card."},
 /* World */
 {id:"types",z:"world",x:230,y:990,t:"Logical scenarios",q:"Which logical scenarios share the budget?",
  card:R_`k=1,\dots,${S("K")}`,
  big:R_`\text{hazardous event}\;\to\;\text{logical scenarios } k=1,\dots,${S("K")}\quad(\text{MECE; one budget and one validation target each})`,
  words:"Derive logical scenarios from the hazardous event: scenario structures with parameter ranges that do not overlap and together cover the event. Each holds one share of the budget and gets one validation target. Light, weather and pedestrian size are parameters inside them, not separate scenarios.",
  who:["Scenario team with the safety lead","Pilot phase"],
  ev:"LS-1 clear view · LS-2 emerging · LS-3 turning",exT:"Encounter shares 82 %, 11 %, 7 %. Occlusion defines LS-2 because the occluding vehicle is an extra actor; turning defines LS-3 because the geometry differs.",step:"s07",
  why:"The logical scenario is the unit of the budget, of exposure counting and of the validation target.",
  assume:"If the logical scenarios overlap or miss cases, the sum in the evaluation is wrong."},
 {id:"lam",z:"world",x:560,y:990,t:"Exposure",q:"How often does it happen?",
  card:R_`${S("lam")}\ \text{per hour}`,
  big:R_`${S("lamU")}=\frac{${S("chi")}\big(2${S("N")}+2\big)}{2\,${S("tau")}}`,
  words:`${W("lam","Encounters per hour")} with logical scenario k, bounded from above by counting ${W("N","N encounters")} in ${W("tau","τ hours")}. The bound is the largest rate under which seeing so few would still be plausible.`,
  ex:R_`${S("lamU")}=4.16,\ 0.559,\ 0.346\ \text{h}^{-1}\ \ (\text{pilot, }1000\ \text{h})`,
  who:["Data and ODD team","Pilot and confirmatory phases"],
  ev:"λ = 4.0 / 0.5 / 0.3 per hour",exT:"Pilot counts 4,000 / 500 / 300 in 1,000 h. Confirmatory 80,000 / 10,000 / 6,000 in 20,000 h gives tighter bounds 4.04 / 0.513 / 0.310.",step:"s05",
  why:"Only reality decides how often things happen. Simulation cannot produce this number.",
  assume:"Exposure depends on route and ODD, so it is not a property of the world alone (Putze et al. 2023, Sec. IV-B)."},
 {id:"tc",z:"world",x:890,y:990,t:"Triggering conditions",q:"Which conditions make it fail?",
  card:R_`${S("p")}=\sum_c ${S("pi")}\,${S("pkc")}`,
  big:R_`${S("p")}=\sum_c ${S("pi")}\;${S("pkc")}\qquad(c:\ \text{regions of the parameter space of logical scenario } k)`,
  words:`A triggering condition (low light, wet road, a child, a short time to arrival) activates a functional insufficiency. Inside a logical scenario it is a region of the parameter space with its own ${W("pi","share")} and ${W("pkc","failure rate")}.`,
  who:["Safety lead with perception and planning teams","Concept and pilot phases"],
  ev:"Occlusion, low light, wet, child, short TTA",exT:"TC-1 occlusion defines LS-2. TC-2 to TC-4 apply to all logical scenarios; TC-5 (≤ 1.5 s at ≥ 40 km/h) to LS-1 and LS-2.",step:"s06",
  why:"They steer the targeted cases (Cl. 10) and the importance sampling (Cl. 11) but hold no budget of their own, so risk is not double-counted.",
  assume:"The list is never complete; missing conditions fall into the reserve.",
  chart:"is"},
 {id:"dens",z:"world",x:230,y:1210,t:"Variant density",q:"Which variants are common?",
  card:R_`${S("x")}\sim ${S("px")}`,
  big:R_`${S("x")}\sim ${S("px")},\qquad \int ${S("px")}\,d${S("x")}=1`,
  words:`Within one type, ${W("x","concrete variants")} are not equally common. ${W("px","The density")} says how often each occurs on real roads.`,
  who:["Data and ODD team","Pilot phase"],
  ev:"Per LS: speeds, timing, light, road, size",exT:"Fitted from the 1,000 pilot hours, with a copula for dependent parameters (course lesson 3).",step:"s06",
  why:"It weights the failure map. A failure in a variant that almost never happens should count little.",
  assume:"The tails, where dangerous variants live, are where field data is thinnest."},
 {id:"unk",z:"world",x:560,y:1210,t:"Unknown situations",q:"What have we not seen yet?",
  card:R_`${S("lnew")}\,${S("pnew")}\le ${S("bu")}`,
  big:R_`${S("lnewU")}\cdot ${S("pnew")}\;\le\;${S("bu")}`,
  words:`Uncatalogued situations happen at ${W("lnew","some rate")}. The ${W("pnew","failure probability there")} cannot be tested, only argued from design.`,
  ex:R_`2.5\cdot10^{-4}\times 1.0\cdot10^{-4}=2.5\cdot10^{-8}\;\le\;5\cdot10^{-8}`,
  who:["Safety lead with the data team","Verdict phase"],
  ev:"2.5·10⁻⁸ ≤ reserve 5·10⁻⁸",exT:"p_new ≤ 10⁻⁴ is argued from the functional restriction of Clause 8: any unclassified object within 3 m of a crosswalk caps speed at 10 km/h, and the restriction is tested on its own.",step:"s10",
  why:"Every other bound assumes the catalogue is complete. This term is the price of that assumption: SOTIF area 3 as a number."},
 /* System */
 {id:"p",z:"sys",x:1240,y:990,t:"Failure probability",q:"How often does it fail when it happens?",
  card:R_`${S("p")}=\int ${S("px")}\,${S("f")}\,d${S("x")}`,
  big:R_`${S("p")}=\int ${S("px")}\;${S("f")}\;d${S("x")}`,
  words:`Average the ${W("f","failure map")} over all variants, each weighted by ${W("px","how common it is")}. The result is the ${W("p","chance of failing in one encounter")}.`,
  ex:R_`${S("pU")}=8.88\cdot10^{-8}\ \ \text{in every logical scenario}`,
  who:["Simulation team","Confirmatory phase"],
  ev:"pᵁ = 8.88·10⁻⁸ in every LS",exT:"Upper bounds after zero failures in 0.57 M, 2.86 M and 5.71 M runs.",step:"s10",
  why:"The bridge between world and system. Most of the test effort exists to bound this one integral."},
 {id:"fmap",z:"sys",x:1560,y:990,t:"Failure map",q:"Where exactly does it fail?",
  card:R_`${S("f")}\in\{0,1\}`,
  big:R_`${S("f")}=\begin{cases}1 & ${S("ys")}< ${S("yc")}+${S("delta")}\\ 0 & \text{otherwise}\end{cases}`,
  words:`For every concrete variant ${W("x","x")}, the car either fails or passes. It belongs to the software release, not to the world.`,
  who:["Simulation team","Pilot and confirmatory phases"],
  ev:"Fails if clearance < 1.17 m in sim",exT:"Metric: distance between robotaxi and pedestrian when the pedestrian reaches the conflict zone. Contact is a failure; in simulation the margin δ is added.",step:"s08",
  why:"This is what testing actually probes, one point at a time.",
  assume:"A new release changes f. Evidence from an earlier release needs its own carry-over argument."},
 {id:"odd",z:"sys",x:1240,y:1210,t:"ODD exit",q:"What if conditions leave the ODD?",
  card:R_`${S("lam")}\,${S("pc")}\,${S("Pmiss")}`,
  big:R_`${S("lam")}\cdot ${S("pc")}\cdot ${S("Pmiss")}\cdot 1`,
  words:`Hazards you cannot mitigate are excluded from the ODD. Risk remains only when the car ${W("Pmiss","does not notice")} it has left.`,
  ev:"Not in the minimal example",exT:"Heavy snow would be outside the ODD. A full case would add this term for it.",step:"s01",
  why:"It turns an untestable hazard (SOTIF area 2) into a testable detection problem."},
 /* Scenarios and test cases */
 {id:"sc_log",z:"scen",x:-660,y:990,t:"Scenario parameters",q:"What varies inside a logical scenario?",
  card:R_`${S("x")}\in\mathcal X_k`,
  big:R_`\text{logical: } ${S("x")}=(v_{\text{ego}},v_{\text{ped}},t_{\text{arr}},\text{light},\text{road},\text{size},\dots)\in\mathcal X_k\;\to\;\text{concrete: one value each}`,
  words:`Each logical scenario has parameters with ranges. Fixing every ${W("x","parameter")} gives one concrete scenario, one test case. Triggering conditions are regions of this space.`,
  who:["Scenario team with the safety lead","Pilot phase"],
  ev:"6–8 parameters per logical scenario",exT:"LS-1: ego speed 20–50 km/h, pedestrian speed 0.8–2.5 m/s, time to arrival 0.5–5 s, light, road, pedestrian size. LS-2 adds occluder type and lateral gap; LS-3 turning speed 10–30 km/h and pedestrian position.",step:"s07",
  why:"The parameter space is where the variant density, the failure map and the test density all live.",
  assume:"How you parameterise changes the results (de Gelder & Op den Camp 2024)."},
 {id:"sc_tc",z:"scen",x:-360,y:990,t:"Triggering-condition infusion",q:"Does the car handle the known weak spots?",
  card:R_`\mathcal X_{\text{TC}}\subset\mathcal X`,
  big:R_`\text{pass}\iff ${S("ys")}(${S("x")}_j)\ge ${S("yc")}+${S("delta")}\quad\text{for every targeted case } ${S("x")}_j\in\mathcal X_{\text{TC}}`,
  words:"Add the known triggering conditions on purpose, alone and in combination, and require every case to pass. This verifies known hazardous scenarios (SOTIF area 2).",
  ex:R_`48+144+48=240\ \text{cases, all pass}`,
  who:["Simulation and proving-ground teams","Pilot phase and before every release"],
  ev:"240 targeted cases",exT:"Light (3) × road (2) × pedestrian (2) × 4 approach speeds = 48 per logical scenario; LS-2 also × 3 occluders = 144. All must clear 1.17 m.",step:"s05s",
  why:"It shows the car copes with each known trigger. It gives no rate, because the cases are chosen, not sampled.",
  assume:"Passing every targeted case says nothing about how often the car fails."},
 {id:"sc_crit",z:"scen",x:-660,y:1210,t:"Critical parameter search",q:"Where does it nearly fail?",
  card:R_`\arg\min_{${S("x")}}\ ${S("ys")}(${S("x")})`,
  big:R_`${S("x")}^{*}=\arg\min_{${S("x")}\in\mathcal X}\ ${S("ys")}(${S("x")}),\qquad \partial F=\{${S("x")}:\ ${S("ys")}(${S("x")})=${S("yc")}+${S("delta")}\}`,
  words:`An optimiser or adaptive sampler searches the parameters for the smallest clearance and maps the failure boundary. It finds weak spots nobody listed and tells the statistical tests (${W("q","q")}) where to concentrate.`,
  who:["Simulation team","Pilot phase"],
  ev:"Boundary: night, ≥ 40 km/h, arrival ≤ 1.5 s",exT:"The pilot search found the closest calls at night, with approach speeds of 40 km/h and more and pedestrians reaching the conflict zone within 1.5 s. Wet roads made it worse, which added wet-road reflections to the trigger list.",step:"s05s",
  why:"It turns unknown hazardous scenarios into known ones (area 3 → area 2) and designs the importance-sampling density.",
  assume:"Search results are not a risk estimate: they over-represent dangerous cases on purpose and carry no weights."},
 {id:"sc_cat",z:"scen",x:-360,y:1210,t:"Test catalogue",q:"Which test answers which question?",
  card:R_`\text{verify}\ \ |\ \ \text{estimate}`,
  big:R_`\text{verification: } f(${S("x")}_j)=0\ \ \forall j\qquad\text{validation: } \hat p_k=\frac{1}{${S("n")}}\sum_i f(${S("x")}_i)\,${S("w","w(x_i)")}`,
  words:"Targeted cases verify that known weak spots are handled (pass/fail). Sampled cases with weights estimate how often the car fails, which is what the risk budget needs.",
  who:["Safety lead with the simulation team","Plan phase"],
  ev:"240 targeted + 9.1 M sampled + 180 pairs",exT:"Targeted cases for area 2 (Clause 10), millions of weighted samples for the rate (Clause 11), and paired real and simulated runs chosen near the failure boundary.",step:"s05s",
  why:"Mixing the two up is a common error: counting critical runs from a search is not a risk estimate.",
  assume:"Every sampled case needs a known weight, otherwise it cannot enter the failure bound."},
 /* Evidence */
 {id:"drv",z:"evi",x:230,y:1540,t:"Field driving",q:"How do we count situations?",
  card:R_`${S("N")}\ \text{in}\ ${S("tau")}\ \text{hours}`,
  big:R_`P\!\left(X\le ${S("N")}\mid ${S("lamU")}${S("tau")}\right)=1-${S("Cb")}\;\;\Longleftrightarrow\;\; ${S("lamU")}=\frac{${S("chi")}(2${S("N")}+2)}{2\,${S("tau")}}`,
  words:`Count ${W("N","N encounters")} in ${W("tau","τ hours")}. The ${W("lamU","upper bound")} is the highest rate at which so few events would still be plausible.`,
  ex:R_`${S("N")}=300,\ ${S("tau")}=1000\ \text{h}:\quad ${S("lamU")}=0.346\ \text{h}^{-1}`,
  who:["Data and ODD team","Pilot (1,000 h) and confirmatory (20,000 h)"],
  ev:"1,000 h pilot + 20,000 h confirmatory",exT:"Auto-labelled fleet logs. One hour of driving counts all three logical scenarios at once.",step:"s05",
  why:"You only need to see situations happen, not the car fail. That is why 21,000 hours replace 6 million.",
  chart:"poisson"},
 {id:"disc",z:"evi",x:560,y:1540,t:"Discovery log",q:"Is the catalogue complete?",
  card:R_`${S("lnewU")}=${S("L")}/${S("tau")}`,
  big:R_`${S("lnewU")}=\frac{${S("L")}}{${S("tau")}},\qquad P(\text{next is new})\approx\frac{${S("N1")}}{${S("Nt")}}`,
  words:`If ${W("tau","τ hours")} brought no new kind of situation, new kinds cannot be frequent. Types seen ${W("N1","only once")} hint at more unseen ones (Good–Turing).`,
  ex:R_`${S("lnewU")}=\frac{5.08}{20\,000}=2.5\cdot10^{-4}\ \text{h}^{-1}`,
  who:["Data and ODD team","Confirmatory phase, then in service"],
  ev:"No new type in 20,000 h",exT:"Every encounter was mapped to one of the three types. Any unexplained hazardous behaviour would count against the reserve.",step:"s10",
  why:"The only statistical evidence about completeness.",
  chart:"disc"},
 {id:"pilot",z:"evi",x:890,y:1540,t:"Pilot scenario exploration",q:"How much does one simulation run count?",
  card:R_`${S("wmax")}=\max\dfrac{${S("px")}}{${S("q")}}`,
  big:R_`${S("wmax")}=\max_{x:\,f(x)=1}\frac{${S("px")}}{${S("q")}}`,
  words:`Exploratory runs find where the car nearly fails and set the test density ${W("q","q")}. The ${W("wmax","importance factor")} says how much one run counts compared with one real encounter. It decides how many runs are needed, not how much risk is allowed.`,
  ex:R_`${S("wmax")}=0.01,\ 0.05,\ 0.10\quad(\text{LS-1, LS-2, LS-3})`,
  who:["Simulation team","Months 1–3"],
  ev:"w = 0.01 / 0.05 / 0.10",exT:"Clear-view scenes are well understood, occlusion less so, turning least. Turning therefore needs the most runs: because it is hardest to test, not because it may carry more risk.",step:"s07",
  why:"It turns the allowed failure probability into a run count. Keeping it out of the budget split keeps test difficulty from setting the risk level.",
  assume:"Runs must be independent concrete scenarios, not frames or slices of one scene (Patel & Jung 2026)."},
 {id:"q",z:"evi",x:1240,y:1540,t:"Test density",q:"Where do we test?",
  card:R_`${S("w")}=\dfrac{${S("px")}}{${S("q")}}`,
  big:R_`${S("w")}=\frac{${S("px")}}{${S("q")}},\qquad \hat p_k=\frac{1}{${S("n")}}\sum_{i=1}^{${S("n")}} f(x_i)\,${S("w","w(x_i)")}`,
  words:`Test dangerous variants more often than reality presents them, using ${W("q","your own density q")}. Each result is down-weighted by ${W("w","w")} so the estimate stays unbiased.`,
  ex:R_`\text{night: } ${S("wmax")}=0.1\;\Rightarrow\;\text{one run counts like 10 real encounters}`,
  who:["Simulation team","End of pilot"],
  ev:"w = 0.01 / 0.05 / 0.10",exT:"Over-weighted: fast approach, late detection, wet road. A 10 % share of runs still follows reality so no region is left untested.",step:"s06",
  why:"Importance sampling: runs land where failures are possible, so each carries more information.",
  assume:"q must never be thinner than p_k anywhere f could be 1, otherwise the weights explode.",
  chart:"is"},
 {id:"sim",z:"evi",x:1560,y:1540,t:"Simulation runs",q:"What do n passed runs prove?",
  card:R_`${S("pU")}=\dfrac{${S("L")}\,${S("wmax")}}{${S("n")}}`,
  big:R_`${S("pU")}=\frac{${S("L")}\,${S("wmax")}}{${S("n")}}+${S("Phi")}(-${S("z")})`,
  words:`If the car really failed with ${W("p","probability p")}, all ${W("n","n runs")} passing would be unlikely. Once that chance drops below 1 − ${W("Cb","C_b")}, p is ruled out.`,
  ex:R_`\text{LS-3: } \frac{5.08\cdot 0.1}{5.71\cdot10^{6}}=8.88\cdot10^{-8}=${S("pstar")}`,
  who:["Simulation team","Months 5–9"],
  ev:"9.1·10⁶ runs, 0 failures",exT:"Planner in the loop with statistically modelled perception errors, on the frozen release. One failure in LS-1 multiplies its bound by 1.41 and fails the evaluation; LS-2 and LS-3 tolerate 2 and 4.",step:"s10",
  why:"The only practical way to reach millions of encounters. Worth nothing without the margin from paired runs.",
  chart:"zerofail"},
 {id:"ops",z:"evi",x:560,y:1750,t:"Field monitoring",q:"Does the fleet keep confirming the claim?",
  card:R_`E(t)\ge \dfrac{1}{1-${S("C")}}`,
  big:R_`E(t)=\Big(\frac{\lambda_1}{${S("RHB")}}\Big)^{k(t)}e^{-(\lambda_1-${S("RHB")})\,t},\quad \lambda_1=2\,${S("RHB")},\quad\text{alarm at } E(t)\ge\frac{1}{1-${S("C")}}=20`,
  words:`After release the fleet keeps counting the behaviour. A likelihood-ratio e-process compares the limit ${W("RHB","R_HB")} with twice the limit and raises an alarm when the evidence ratio reaches 20. It stays valid however often it is checked.`,
  ex:R_`0.365\ \text{events per year at the limit};\ \ \text{alarm at } k=5\ (1\ \text{yr}),\ 6\ (2\ \text{yr}),\ 7\ (5\ \text{yr})`,
  who:["Field monitoring team with the safety lead","Operation"],
  ev:"Alarm at 5 events in year one",exT:"730,000 fleet hours a year. A fixed one-year rule alarms at 3 events but is valid for one look per year only. A year without events bounds the rate only at 8× the limit: monitoring can show a violation, not confirm the criterion.",step:"s11",
  why:"Clause 13 closes the loop: the release claim becomes a hypothesis the fleet keeps testing. Any field event that matches no listed triggering condition counts against the reserve and starts the issue process.",
  assume:"Field events must be detected and attributed reliably; an undetected hazardous behaviour never enters the count.",
  chart:"eproc"},
 {id:"mon",z:"evi",x:1240,y:1750,t:"ODD-exit tests",q:"Does the car notice?",
  card:R_`P_{\text{miss}}^{U}=${S("L")}/${S("nex")}`,
  big:R_`${S("Pmiss","P_{\\text{miss}}^{U}")}=\frac{${S("L")}}{${S("nex")}}`,
  words:`Zero missed exits in ${W("nex","n runs")} bounds the ${W("Pmiss","miss probability")} by the same zero-failure rule.`,
  ev:"Not in the minimal example",exT:"Would be needed once heavy snow or sensor degradation is excluded from the ODD.",step:"s01",
  why:"Supplies the one number the ODD-exit term needs."},
 {id:"pair",z:"evi",x:1560,y:1750,t:"Paired sim/real runs",q:"Can we trust the simulator?",
  card:R_`${S("delta")}=${S("mu")}+${S("z")}\,${S("sig")}`,
  big:R_`${S("e")}=${S("ys")}-${S("yr")},\qquad \text{pass}\iff ${S("ys")}\ge ${S("yc")}+${S("delta")},\qquad ${S("delta")}=${S("mu")}+${S("z")}\,${S("sig")}`,
  words:`Run the same scenario in simulation and on the proving ground. A simulated pass only counts if it clears contact by more than the ${W("e","simulator error")} could plausibly be.`,
  ex:R_`0.05+6.5\cdot 0.17=1.17\ \text{m},\qquad ${S("Phi")}(-6.5)=4\cdot10^{-11}`,
  who:["Proving-ground and simulation teams","Before the freeze"],
  ev:"180 pairs → δ = 1.17 m",exT:"60 pairs per logical scenario with a pedestrian dummy target. z = 6.5 so that Φ(−z) is 0.05 % of the allowed p*.",step:"s08",
  why:"Without this card, millions of simulation runs say nothing about the real car.",
  assume:"A Gaussian tail at 6.5σ cannot be checked with 180 pairs. The weakest link of the whole argument.",
  chart:"gauss"},
 /* Inference */
 {id:"freq",z:"inf",x:1960,y:990,t:"Frequentist inference",q:"What does “95 %” mean here?",
  card:R_`P\big(${S("lamU")}\ge ${S("lam")}\big)\ge ${S("Cb")}`,
  big:R_`P_{\text{data}}\big(${S("lamU")}\ge ${S("lam")}\big)\;\ge\;${S("Cb")}`,
  words:`The true ${W("lam","rate")} is fixed; the data is random. The procedure produces a ${W("lamU","bound")} above the truth in at least ${W("Cb","C_b")} of repeated campaigns.`,
  ev:"All 8 bounds at 99.375 %",exT:"Every bound in the example (exposure, failure, unknown, simulator spread) is of this kind.",step:"s05",
  why:"Needs no prior and is what assessors expect.",
  assume:"It never says “P(R ≤ target) = 95 %”, and it combines simulation and road data only through hard rules like the margin δ."},
 {id:"bayes",z:"inf",x:1960,y:1210,t:"Bayesian inference",q:"What if we use prior knowledge?",
  card:R_`P(${S("lam")}\le x\mid \text{data})`,
  big:R_`P\big(${S("lam")}\le x\mid ${S("tau")},\,N{=}0\big)=1-e^{-x${S("tau")}}\;\ge\;${S("C")}\;\Rightarrow\;${S("tau")}=\frac{\ln 20}{x}`,
  words:`The ${W("lam","rate")} is uncertain; the data is fixed. With a flat prior and zero events you get the same ${W("tau","3/x hours")} as the frequentist bound.`,
  ev:"Not used; would credit the last release",exT:"A prior from the previous software release or from simulation would shorten the campaign, and that prior is what you would then have to defend.",step:"s04",
  why:"Both schools agree when you know nothing. They differ exactly where you add knowledge.",
  chart:"post"},
 {id:"bonf",z:"inf",x:1960,y:1430,t:"Bonferroni correction",q:"Do all bounds hold at once?",
  card:R_`${S("Cb")}=1-\dfrac{1-${S("C")}}{${S("m")}}`,
  big:R_`${S("Cb")}=1-\frac{1-${S("C")}}{${S("m")}}\;\Rightarrow\;\text{all } ${S("m")}\text{ bounds hold with}\ \ge ${S("C")}`,
  words:`The verdict uses ${W("m","m bounds")}. Making each one stricter keeps the joint claim at ${W("C","95 %")}. The rule-of-three factor 3 grows to ${W("L","L")}.`,
  ex:R_`${S("m")}=8:\ \ ${S("Cb")}=99.375\,\%,\quad ${S("L")}=\ln 160=5.08`,
  ev:"8 bounds → L = 5.08 instead of 3",exT:"3 exposure, 3 failure, 1 unknown-situation and 1 simulator-spread bound.",step:"s05",
  why:"Conservative, but simple and easy to defend. The cost grows only logarithmically with m.",
  chart:"bonf"},
 /* Mathematical foundations */
 {id:"m_chain",z:"math",x:80,y:2110,t:"Chain rule",q:"How do conditional chances multiply?",
  card:R_`P(A\cap B)=P(A)\,P(B\mid A)`,
  big:R_`P(A\cap B\cap C)=P(A)\;P(B\mid A)\;P(C\mid A,B)`,
  words:"The chance that several things all happen is the chance of the first, times the chance of the second given the first, and so on. Nothing is assumed.",
  ex:R_`${S("AH")}=${S("RHB")}\cdot P(E\mid HB)\,P(\bar C\mid E,HB)\,P(S\mid \bar C,E,HB)`,
  ev:"5·10⁻⁷ × 0.5 × 0.5 × 0.8 = 10⁻⁷",exT:"Annex C writes the shortened conditions P(C̄ | E) and P(S | C̄). Dropping the earlier events is an independence assumption.",step:"s03",
  why:"Annex C is exactly this rule applied to harm. Knowing the full form shows which independence you are assuming."},
 {id:"m_thin",z:"math",x:370,y:2110,t:"Thinning a Poisson process",q:"Why can rates be multiplied by probabilities?",
  card:R_`\text{rate }\lambda,\ \text{keep w.p. } p\;\Rightarrow\;\lambda p`,
  big:R_`N(t)\sim\text{Poisson}(\lambda t),\ \text{each event kept w.p. } p\;\Rightarrow\;N_{\text{kept}}(t)\sim\text{Poisson}(\lambda p\,t)`,
  words:"If encounters arrive at random at rate λ and each one independently leads to a failure with probability p, failures arrive at random at rate λ·p.",
  ex:R_`0.346\ \text{h}^{-1}\times 8.88\cdot10^{-8}=3.07\cdot10^{-8}\ \text{h}^{-1}\ \ (\text{LS-3})`,
  ev:"LS-3: 0.346 × 8.88·10⁻⁸",exT:"This is why R = Σ λ·p, why p* = b/λ, and why R_HB times the chain gives A_H.",step:"s05",

const PLAIN={
 m_eproc:["s","A running score of evidence against the claim. If the claim is true, the score stays small on average, so it rarely gets large, however often you look at it. When it passes 20, the claim is in trouble."],
 ops:["b","After release, keep counting. Field data cannot prove the car safe enough, because a year without any event only shows the rate is below 8 times the limit. But it can show the car is not safe enough: five events in the first year would be very unlikely if the car met its goal, so they raise the alarm."],
 mod:["b","If the car cannot handle a difficult condition well enough, change the car: improve it, restrict it, or hand over. Here the robotaxi slows to 10 km/h whenever something it cannot classify is near a crosswalk. That also limits the damage in situations nobody thought of."],
 spec:["b","Write down what the robotaxi is supposed to do and where it may drive, precisely enough that a mistake can be recognised and counted. Here: always yield to someone with right of way, defined as never entering the crossing zone above 10 km/h while that person is less than 2 seconds away."],
 hz:["b","List what the vehicle could do wrong, described without any setting: not yielding, braking for no reason, accelerating or steering unexpectedly, or losing braking, steering or propulsion. Each item gets its own safety goal."],
 he:["b","A behaviour only hurts someone in a setting where a person is exposed. “Does not yield” combined with “pedestrian stepping onto a zebra crossing” is one such hazardous event. The same behaviour has other hazardous events (a cyclist when turning, an oncoming car), and each hurts a different kind of road user."],
 fi:["b","Ask why the car could make the mistake: its sensors see a pedestrian too late, its prediction misreads what the pedestrian will do, or it decides too late. The conditions that provoke these weaknesses, such as darkness or a parked bus blocking the view, are the triggering conditions."],
 sevc:["b","Turn the hazard ratings into numbers: how often the exposed person cannot get out of the way, and how often a collision injures them. Accident studies and injury curves over impact speed supply these numbers."],
 sc_log:["b","Each scenario pattern is a test recipe with knobs: the robotaxi's speed, the pedestrian's speed and timing, light, road surface, adult or child. Setting every knob gives one concrete test. Difficult settings such as darkness are areas of knob positions, not separate recipes."],
 sc_tc:["b","Deliberately turn on the conditions known to cause trouble, one at a time and in combination, and require the car to pass every case. These are targeted pass/fail checks."],
 sc_crit:["b","Let a computer turn the knobs in search of the closest calls. This finds weak spots nobody listed and shows the large random test campaign where to look hardest."],
 sc_cat:["b","Two kinds of test come out: targeted pass/fail checks for known weak spots, and large random samples that measure how often the car fails. The first finds problems; only the second gives a rate."],
 hbdef:["b","A hazardous behaviour is what the car does, described without a setting: not yielding, braking for no reason. Harm only follows if it happens where someone is exposed (a pedestrian stepping onto a zebra crossing), the person cannot get out of the way, and the collision injures them. Each link is a chance, not a certainty."],
 bench:["b","To call the robotaxi safe enough, compare it with human drivers in the same kind of traffic. Here a placeholder: human drivers injure about 5 pedestrians per million hours of driving. Real data must be matched to the robotaxi's roads, speeds and times."],
 crit:["b","The goal as one number: through this one mistake, the robotaxi may injure a pedestrian less than once per 10 million hours of driving. We got there by asking for 10 times better than humans and giving this mistake one fifth of that allowance, because other mistakes can hurt pedestrians too."],
 hb:["b","Not every mistake hurts someone. Only half the time is a pedestrian really stepping out, only half of those cannot escape, and 8 in 10 collisions injure. So only 1 mistake in 5 leads to harm (0.5 × 0.5 × 0.8 = 0.2). The mistake itself may therefore happen 5 times as often as the harm: once per 2 million hours."],
 vt:["b","The obvious test: drive and wait. If the car made the mistake once per 2 million hours, then in 6 million hours you would expect 3 mistakes. Seeing none at all would then happen only 5 % of the time. So 6 million mistake-free hours show, with 95 % confidence, that the rate is low enough. For a fleet of 100 cars that is about 8 years, and every software update starts the clock again."],
 stop:["b","At the end, add up the worst plausible rate from every kind of crossing, plus the allowance for surprises. If the total stays under the limit (once per 2 million hours), the goal is shown. It is like checking that all monthly expenses together stay within your income."],
 budget:["b","Like a household budget: the total allowance is fixed. Keep 10 % aside for things nobody has thought of yet, and share the rest among the kinds of crossing you know."],
 human:["b","A fairness check. No single kind of crossing may be handled worse than a human driver would handle it, even if the total looks fine. Otherwise the car could be excellent by day and worse than humans at night, and night-time pedestrians would carry the risk."],
 alloc:["b","The budget split decides how much risk each kind of crossing may carry. The fair rule: every pedestrian gets the same protection, whichever kind of crossing they are in. So each kind gets budget in proportion to how often it happens. Clear-view crossings happen most often and get 82 % of the budget, and every crossing ends up with the same allowed failure chance, 1 in 11.3 million. What testing costs plays no role."],
 pstar:["b","Turn the hourly allowance into an allowance per crossing. Turning crossings happen about 0.35 times an hour and may cause at most 0.31 mistakes per 10 million hours. So the car may fail in at most 1 of 11.3 million turning crossings, the same as in every other kind."],
 freeze:["b","Before the real test campaign, write down exactly what will be tested and how pass and fail are judged, and get it approved. Like a referee: the rules are fixed before the match, not after seeing the score."],
 R:["b","The one number everything is about: how often the robotaxi really makes this mistake per hour. Nobody can see it directly. It equals “how often each kind of crossing happens” times “how often the car fails in it”, added up over the kinds."],
 types:["b","Sort all crossings of this kind into a few scenario patterns that do not overlap and together cover everything: pedestrian in clear view, pedestrian stepping out from behind a parked vehicle, robotaxi turning onto the crossing. Each pattern gets its own share of the budget and its own test target. Darkness or rain are settings inside each pattern, not patterns of their own."],
 lam:["b","Count how often each kind of crossing happens during normal driving. 300 night crossings in 1,000 hours is about 0.3 per hour. Counts wobble by chance, so we use a slightly higher, cautious value (0.35)."],
 tc:["b","Conditions that make the sensors or the software struggle: darkness, a vehicle blocking the view, wet-road reflections, a small child, a pedestrian arriving very late. Inside each scenario pattern they mark the difficult areas, which get targeted tests and more random samples. They do not get their own budget."],
 dens:["s","Even among night crossings, some versions are common (pedestrian seen early, car slow) and some are rare (pedestrian appears late, car fast). This describes how common each version is on real roads, so rare versions can be counted as rare."],
 unk:["b","Some situations nobody has thought of yet. You cannot test those, so you keep a reserve for them and argue that the car is cautious when something unexpected appears: it slows to 10 km/h near anything it cannot classify."],
 p:["s","The chance the car fails in one crossing of a given kind. It is an average over all versions of that crossing: rare dangerous versions count little, common easy ones count a lot. The ∫ sign just means “add up over all versions”."],
 fmap:["b","Imagine a huge table listing every possible version of a crossing and, for each one, “car fails” or “car passes”. That table is the failure map. Every test fills in one entry."],
 odd:["b","If a condition is too hard, such as heavy snow, the robotaxi is not allowed to drive in it. The remaining risk is the car not noticing that snow has started."],
 drv:["b","Drive a fleet and let software tag every crossing it meets. The counts say how often each kind of crossing happens. You need to see crossings, not accidents, which is why 21,000 hours are enough here instead of 6 million."],
 disc:["b","Keep a diary of every new kind of situation the fleet meets. If 20,000 hours bring nothing new, new kinds must be rare: at most about once in 4,000 hours."],
 pilot:["b","A small trial of the simulation before the real campaign. It shows where the car comes close to failing, so the main campaign can test those spots more often. Each such run then counts like several ordinary crossings. This changes how many runs are needed, never how safe the car must be."],
 q:["s","Test the dangerous versions more often than they happen in reality, then count each result for less. Like a survey that interviews extra people in a small town to hear enough from it, and then weights their answers down so the national result stays fair."],
 sim:["b","Run hundreds of thousands of simulated crossings. If none fails, the car's true failure chance must be small: had it been bigger than the allowance, you would almost certainly have seen at least one failure among that many crossings."],
 mon:["b","Test whether the car notices when conditions leave its allowed domain, for example when snow starts. Zero misses in many tests puts an upper limit on how often it would miss."],
 pair:["b","Run the same crossing in the simulator and on a test track with a dummy pedestrian. The difference shows how wrong the simulator can be. A simulated pass only counts if the car kept a gap (1.17 m) larger than any plausible simulator error. Like building a bridge for more weight than it will ever carry."],
 freq:["s","“95 % confident” here means: if you repeated the whole test campaign many times, this method would give a limit above the true value in at least 95 of 100 campaigns. It describes the method, not a probability about this particular car."],
 bayes:["s","A second way of reasoning: start from a belief about the rate, then update it with the data. With no prior knowledge it gives the same answer. With prior knowledge, such as results from the previous software version, it could need less testing, but you must justify that knowledge."],
 bonf:["s","The final check rests on eight separate claims. Each could be wrong by bad luck, and those chances add up. To keep the chance that any of them is wrong at 5 %, each must be wrong at most 1 time in 160. The cost: the factor 3 from the rule of three grows to about 5."],
 m_chain:["b","To get the chance that A and B and C all happen, multiply: the chance of A, times the chance of B once A has happened, times the chance of C once both have. Example: 0.5 × 0.5 × 0.8 = 0.2."],
 m_thin:["b","If crossings happen 0.35 times an hour and the car fails in a small fraction of them, failures happen 0.35 × that fraction times an hour. Rate times chance gives a new rate."],
 m_total:["b","To get an overall chance, split everything into groups, take each group's chance, weight it by the group's size, and add. Like an overall grade made of weighted sub-grades."],
 m_expect:["s","An average in which common cases count more than rare ones. The ∫ sign means “add up over all versions”, the continuous version of a sum."],
 m_is:["s","If you test dangerous versions 10 times more often than reality presents them, give each of those results one tenth of the weight. The weighted average comes out the same as testing in proportion to reality, but you learn far more about the dangerous part."],
 m_binom:["s","If each run fails with a small chance p, the chance that n runs all pass is (1 − p) multiplied by itself n times. Once n × p is above about 3, that chance is below 5 %."],
 m_union:["b","The chance that at least one of several things goes wrong is at most the sum of their chances. Two 1 % risks give at most 2 %."],
 m_bayes:["s","Updating a belief with evidence: the new belief is the old belief, re-weighted by how well each possibility explains what you saw."],
 m_pois:["s","The standard model for random events with a steady average rate, such as raindrops on a window or calls to a hotline. It tells how likely each count is. For example, if 3 events are expected, seeing none has a 5 % chance."],
 m_zero:["b","The rule of three. If something has not happened in a long stretch, its rate is very likely below 3 divided by the length of that stretch. Reason: if 3 events were expected, seeing none happens only 5 % of the time."],
 m_chi:["s","When you did see some events, you need a number a bit bigger than 3. A table gives it: about 4.7 after one event and 6.3 after two (at 95 %). It is a lookup, not something to compute by hand."],
 m_gt:["b","If many of the things you have seen were one-of-a-kind, there are probably more kinds you have not seen. The share of one-offs estimates the chance that the next one is new."],
 m_norm:["s","Errors usually follow the bell curve. Being off by more than 6.5 typical errors is extremely rare under that curve: about 4 in 100 billion. Whether real simulator errors follow the bell curve that far out is the open question."]
};

  ["Under the claim the rate is λ₀; under the alternative it is λ₁ > λ₀. After t hours with k events, the likelihood ratio of the two is",R_`E(t)=\Big(\frac{\lambda_1}{\lambda_0}\Big)^{k}e^{-(\lambda_1-\lambda_0)t}`],

  ["So you may check after every event or every day and stop at the first alarm. With α = 0.05 the alarm level is 20.",R_`\text{alarm at } E(t)\ge 20`],

  ["The groups do not overlap, so these pieces simply add up to the overall chance: a weighted average.",R_`P(F)=\sum_c P(c)\,P(F\mid c)`],

    if(Math.abs(dy)>Math.abs(dx)*0.6){c1=[a.cx,a.cy+dy*0.5];c2=[b.cx,b.cy-dy*0.5];}else{c1=[a.cx+dx*0.5,a.cy];c2=[b.cx-dx*0.5,b.cy];}
    const p=document.createElementNS("http://www.w3.org/2000/svg","path");p.setAttribute("d",`M${a.cx} ${a.cy} C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${b.cx} ${b.cy}`);if(e[4])p.setAttribute("class","math");svg.appendChild(p);e.path=p;
    const t=e[4]?0.72:0.5,u=1-t;const mx=u*u*u*a.cx+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*b.cx,my=u*u*u*a.cy+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*b.cy;
    const l=document.createElement("div");l.className="elab"+(e[4]?" math":"");l.innerHTML=tex(e[2])+(e[3]?`<span class="ev">${e[3]}</span>`:"");l.style.left=mx+"px";l.style.top=my+"px";world.appendChild(l);e.lab=l;});
  const all=Object.values(ZONES).map(z=>z.b);WB=[Math.min(...all.map(b=>b[0])),Math.min(...all.map(b=>b[1])),Math.max(...all.map(b=>b[2])),Math.max(...all.map(b=>b[3]))];
  svg.setAttribute("width",WB[2]+50);svg.setAttribute("height",WB[3]+50);
}

/* ---------- camera ---------- */
let view={x:0,y:0,s:1};
function apply(){world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;world.classList.toggle("far",view.s<0.36);}
const clampS=s=>Math.max(0.1,Math.min(2.5,s));
function zoomAt(f,px,py){const s=clampS(view.s*f),k=s/view.s;view.x=px-(px-view.x)*k;view.y=py-(py-view.y)*k;view.s=s;apply();}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;let animId=0;
function flyTo(t,anim=true){cancelAnimationFrame(animId);if(!anim||reduce){view={...t};apply();return;}const s0={...view},t0=performance.now();
  const step=now=>{let u=Math.min(1,(now-t0)/480);u=1-Math.pow(1-u,3);view={x:s0.x+(t.x-s0.x)*u,y:s0.y+(t.y-s0.y)*u,s:s0.s+(t.s-s0.s)*u};apply();if(u<1)animId=requestAnimationFrame(step);};animId=requestAnimationFrame(step);}
const mobile=()=>innerWidth<=760;
function fit(anim=true){const r=stage.getBoundingClientRect();const pw=(!panel.hidden&&!mobile())?460:0,pad=36;
  const s=clampS(Math.min((r.width-pw-2*pad)/(WB[2]-WB[0]),(r.height-2*pad)/(WB[3]-WB[1])));
  flyTo({s,x:pad+(r.width-pw-2*pad-(WB[2]-WB[0])*s)/2-WB[0]*s,y:pad+(r.height-2*pad-(WB[3]-WB[1])*s)/2-WB[1]*s},anim);}
function focusNode(n){const r=stage.getBoundingClientRect();const s=clampS(Math.max(view.s,mobile()?0.65:0.8));const aw=mobile()?r.width:r.width-460,ah=mobile()?r.height*0.38:r.height;flyTo({s,x:aw/2-n.cx*s,y:ah/2-n.cy*s});}

/* ---------- panel ---------- */
let selected=null,tourIdx=-1;
function linkHover(root){
  const set=(id,on)=>root.querySelectorAll(`[data-s="${id}"]`).forEach(e=>e.classList.toggle("hl",on));
  root.querySelectorAll("[data-s]").forEach(el=>{const id=el.dataset.s;el.addEventListener("mouseenter",()=>set(id,true));el.addEventListener("mouseleave",()=>set(id,false));
    el.addEventListener("click",ev=>{ev.stopPropagation();const on=!el.classList.contains("hl");root.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));if(on){set(id,true);const row=root.querySelector(`tr[data-s="${id}"]`);if(row&&el.tagName!=="TR")row.scrollIntoView({block:"nearest",behavior:reduce?"auto":"smooth"});}});});
}
function connButtons(list,id){return list.map(e=>{const o=byId[e[0]===id?e[1]:e[0]];return `<button data-go="${o.id}" class="${ZONES[o.z].cls}"><span class="dot"></span>${o.t}<span class="cl">${tex(e[2])}</span></button>`;}).join("");}
function lessonHTML(id){const L=LESSON[id],n=byId[id];if(!L)return "";
  const pre=L.pre.length?`<p class="mathlead">Read first: ${L.pre.map(p=>`<button class="prelink" data-go="${p}">${byId[p].t}</button>`).join(" ")}</p>`:`<p class="mathlead">Needs only school maths.</p>`;
  return `<h3>Step by step</h3>${pre}<ol class="lsteps">${L.steps.map(st=>`<li><p>${st[0]}</p>${st[1]?`<div class="disp lsd">${tex(st[1],true)}</div>`:""}</li>`).join("")}</ol>
  <h3>The result</h3><div class="disp">${tex(n.big,true)}</div>${srcHTML(id)}`;}
function checkHTML(id){const L=LESSON[id];if(!L)return "";
  return `<h3>Check yourself</h3><div class="check"><p>${L.check[0]}</p><details><summary>Show answer</summary><p>${L.check[1]}</p></details></div>
  <div class="assume"><strong>Common mistake</strong>${L.pitfall}</div>`;}
function select(id,{fly=true}={}){
  selected=id;const n=byId[id];const es=E.filter(e=>e[0]===id||e[1]===id);const nb=new Set([id]);es.forEach(e=>{nb.add(e[0]);nb.add(e[1]);});
  N.forEach(m=>{m.el.classList.toggle("sel",m.id===id);m.el.classList.toggle("dim",!nb.has(m.id));});
  E.forEach(e=>{const hit=e[0]===id||e[1]===id;e.path.classList.toggle("hi",hit);e.path.classList.toggle("dim",!hit);e.lab.classList.toggle("hi",hit);e.lab.classList.toggle("dim",!hit);});
  const tag=document.getElementById("pTag");tag.textContent=ZONES[n.z].n+(ISO[id]?" · ISO 21448 "+ISO[id]:"");tag.className="tag "+ZONES[n.z].cls;tag.style.color="";
  document.getElementById("pTitle").textContent=n.t;
  const ids=symsIn(n.big+(n.ex||""));
  const rows=ids.map(s=>`<tr data-s="${s}" style="--rc:var(--c-${SYM[s].c})"><td>${tex(S(s))}</td><td>${SYM[s].n}</td><td class="src">${SYM[s].s}</td></tr>`).join("");
  const steps=es.filter(e=>!e[4]),maths=es.filter(e=>e[4]);
  const ch=n.chart?CHARTS[n.chart]:null;
  const pl=PLAIN[id];
  document.getElementById("pBody").innerHTML=`<p class="dek">${n.q}<span class="lvtag">${LV[pl[0]]}</span></p>
    ${n.who?`<div class="who"><span><b>Who</b>${n.who[0]}</span><span><b>When</b>${n.who[1]}</span></div>`:""}
    <h3>In plain words</h3><div class="plainbox">${pl[1]}</div>
    ${n.ev?`<h3>In the robotaxi example</h3><div class="exbox"><div class="exl">${n.ev}</div><p>${n.exT||""}</p>${n.ex?`<div class="disp ex">${tex(n.ex,true)}</div>`:""}<p style="margin-top:8px"><a href="${EXURL}#${n.step}">Read this step in the worked example →</a></p></div>`:""}
    ${n.z==="math"?lessonHTML(id):`<h3>The maths</h3><p class="mathlead">${pl[0]==="b"?"The same idea as a formula. Coloured letters are explained in the table below.":"Optional if the plain version made sense. Coloured letters are explained below."}</p>
    <p>${n.words}</p><div class="disp">${tex(n.big,true)}</div>
    ${rows?`<h3>Every symbol</h3><table class="syms">${rows}</table>`:""}
    ${srcHTML(id)}
    ${maths.length?`<h3>Maths you need for this step</h3><p class="mathlead">Each opens a step-by-step lesson that starts from school maths.</p><div class="conn">${connButtons(maths,id)}</div>`:""}`}
    ${ch?`<h3>Try it</h3><div class="viz" id="viz">${ch.html}</div>`:""}
    ${n.z==="math"?checkHTML(id):""}
    <h3>Why it matters</h3><p>${n.why}</p>
    ${n.assume?`<div class="assume"><strong>Assumption to defend</strong>${n.assume}</div>`:""}
    ${steps.length?`<h3>${n.z==="math"?"Used in these steps":"Connected steps"}</h3><div class="conn">${connButtons(steps,id)}</div>`:""}
    ${n.z==="math"&&maths.length?`<h3>Related foundations</h3><div class="conn">${connButtons(maths,id)}</div>`:""}`;
  const pb=document.getElementById("pBody");pb.scrollTop=0;linkHover(pb);
  if(ch){const v=document.getElementById("viz");ch.draw(v);v.querySelectorAll("input,select").forEach(i=>{i.addEventListener("input",()=>ch.draw(v));i.addEventListener("change",()=>ch.draw(v));});}
  panel.hidden=false;document.getElementById("hint").hidden=true;
  const tb=document.getElementById("tourBar");
  if(tourIdx>=0&&ACT[tourIdx]===id){tb.hidden=false;document.getElementById("tourStep").textContent=`${ACT===MATHPATH?"Maths path":"Tour"} · ${tourIdx+1} of ${ACT.length}`;document.getElementById("tourPrev").disabled=tourIdx===0;document.getElementById("tourNext").textContent=tourIdx===ACT.length-1?"Finish":"Next";}
  else{tourIdx=-1;tb.hidden=true;}
  if(fly)focusNode(n);
}
function clearHi(){N.forEach(m=>m.el.classList.remove("sel","dim"));E.forEach(e=>{e.path.classList.remove("hi","dim");e.lab.classList.remove("hi","dim");});}
function showKey(){
  selected=null;tourIdx=-1;clearHi();
  const tag=document.getElementById("pTag");tag.className="tag";tag.style.color="var(--ink-soft)";tag.textContent="Legend";document.getElementById("pTitle").textContent="Reading the map";
  let h=`<p class="dek">Every symbol has one colour everywhere: on cards, connections, equations and plots.</p><p>Colour says what kind of quantity a symbol is, so you can read an equation's structure before its letters. A <span class="w cat-world">world</span> rate times a <span class="w cat-sys">system</span> probability gives the risk; a <span class="w cat-req">requirement</span> divided by a <span class="w cat-world">world</span> rate gives another requirement.</p><div class="keygrid">`;
  for(const c in CAT){const ss=Object.keys(SYM).filter(s=>SYM[s].c===c);h+=`<div class="keycat" style="--rc:var(--c-${c})"><div class="kn">${CAT[c].n}</div><div class="kd">${CAT[c].d}</div><div style="font-size:18px;margin-top:4px;line-height:1.9">${ss.map(s=>tex(S(s))).join(" &nbsp; ")}</div></div>`;}
  h+=`<div class="keycat" style="--rc:var(--c-ex)"><div class="kn">Robotaxi example</div><div class="kd">Orange chips and edge numbers: one hazardous behaviour worked through the whole map.</div></div>`;
  h+=`<div class="keycat" style="--rc:var(--c-math)"><div class="kn">Mathematical foundations</div><div class="kd">Bottom zone. Dotted lines rise to every step that uses the result.</div></div>`;
  h+=`</div><h3>Layout</h3><p>Far left: the hazard analysis (HARA) and the scenarios derived from it. Top: what you demand. Centre: the one unknown rate. Below it, left and right: its two factors, world and system. Then the evidence for each. Right: how evidence becomes a claim. Bottom: the mathematics underneath all of it. Zoom out to see only the questions; zoom in to see the maths.</p>`;
  document.getElementById("pBody").innerHTML=h;document.getElementById("tourBar").hidden=true;panel.hidden=false;document.getElementById("hint").hidden=true;
}
function showPrimer(){
  selected=null;tourIdx=-1;clearHi();
  const tag=document.getElementById("pTag");tag.className="tag";tag.style.color="var(--c-req)";tag.textContent="Start here";document.getElementById("pTitle").textContent="Six ideas you need";
  document.getElementById("pBody").innerHTML=`<div class="primer"><p class="dek">Everything on this map uses only these six ideas. Each takes a minute.</p>
  <div class="idea"><b class="h">1 · Reading very small numbers</b>Safety targets are tiny, so they are written as powers of ten. The small number up top says how many places the decimal point moves.
  <table><tr><th>Written</th><th>Decimal</th><th>In words</th></tr>
  <tr><td>10⁻³</td><td>0.001</td><td>1 in a thousand</td></tr>
  <tr><td>10⁻⁶</td><td>0.000001</td><td>1 in a million</td></tr>
  <tr><td>10⁻⁷</td><td>0.0000001</td><td>1 in ten million</td></tr>
  <tr><td>5·10⁻⁷ /h</td><td>0.0000005 per hour</td><td>once every 2 million hours</td></tr></table>
  The trick for rates: 1 divided by the rate is the waiting time. 1 ÷ 5·10⁻⁷ = 2,000,000 hours.</div>
  <div class="idea"><b class="h">2 · Rates and chances</b>A <i>rate</i> counts per hour: “4 crossings per hour”. A <i>chance</i> is per event: “fails in 1 of 10 million crossings”. Multiply them and you get a new rate: 4 × 1/10,000,000 = 4 failures per 10 million hours. The whole map rests on this one multiplication.</div>
  <div class="idea"><b class="h">3 · Chains of chances multiply</b>Harm needs several things to go wrong in a row. Half the time a pedestrian is really there, half of those cannot step back, 8 in 10 collisions injure: 0.5 × 0.5 × 0.8 = 0.2, so 1 mistake in 5 hurts someone.</div>
  <div class="idea"><b class="h">4 · You cannot measure “zero”, only bound it</b>Seeing no failures does not prove there are none. It proves they are rare. The <i>rule of three</i>: if nothing happened in a stretch of n tries (or hours), the rate is very likely below 3 ÷ n. Why 3? If you expected 3 events, seeing none happens only 5 % of the time.</div>
  <div class="idea"><b class="h">5 · “95 % confident” and upper bounds</b>Because counts vary by luck, we never use the plain average. We use an <i>upper bound</i>: the most pessimistic value that still fits the data. “95 % confident” means this way of calculating lands above the true value at least 95 times in 100.</div>
  <div class="idea"><b class="h">6 · Test the dangerous cases more, then weigh them less</b>Most crossings are easy. Testing them all wastes effort. So the dangerous ones are tested more often than they happen, and each such result counts for less, like a survey that over-samples a small town and weights its answers down.</div>
  <h3>How to read the map</h3><p>Every card names the ISO 21448 clause it belongs to, and the guided tour follows the clauses in order, from the specification (Cl. 5) to the operation phase (Cl. 13). Far left, top: the specification and hazard analysis (HARA) that say what can go wrong. Far left, middle: the scenarios that turn hazardous events into tests. Top: what we demand. Centre: the one true rate nobody can see. Below it, left: how often things happen on real roads. Right: how often the car fails when they do. Then the evidence for each, how evidence becomes a claim, and at the very bottom the maths underneath. Each card shows a difficulty label; “basic” cards need nothing beyond these six ideas.</p>
  <h3>Words used on the map</h3><dl>
  <dt>ODD</dt><dd>Operational design domain: the roads, speeds, times and weather the robotaxi is allowed to drive in.</dd>
  <dt>Hazardous behaviour</dt><dd>What the vehicle does wrong, described without a situation: does not yield, unintended braking, acceleration or steering, loss of braking, steering or propulsion.</dd>
  <dt>Operational situation</dt><dd>The setting the vehicle is in, such as approaching a zebra crossing with a pedestrian about to cross.</dd>
  <dt>Hazardous event</dt><dd>A hazardous behaviour in an operational situation where someone is exposed, e.g. not yielding while a pedestrian steps onto a zebra crossing.</dd>
  <dt>Exposure</dt><dd>How often a situation occurs, per hour of driving.</dd>
  <dt>Encounter</dt><dd>One occurrence of a situation, such as one crossing with a pedestrian.</dd>
  <dt>Triggering condition</dt><dd>A circumstance that makes the system struggle: darkness, occlusion, rain.</dd>
  <dt>MECE</dt><dd>Mutually exclusive, collectively exhaustive: categories that do not overlap and leave nothing out.</dd>
  <dt>Validation target</dt><dd>How much testing is needed, such as “660,000 night runs with no failure”.</dd>
  <dt>Proving ground</dt><dd>A closed test track, here with a dummy pedestrian.</dd>
  <dt>Assessor</dt><dd>An independent expert (for example from TÜV) who checks the argument.</dd>
  <dt>Release</dt><dd>One frozen version of the car's software. All evidence must come from the same one.</dd></dl>
  <h3>Reading the notation</h3><table class="notation">
  <tr><td>Σ<sub>k</sub></td><td>Add up over all k. Σ<sub>k</sub> λ<sub>k</sub> p<sub>k</sub> means λ₁p₁ + λ₂p₂ + λ₃p₃.</td></tr>
  <tr><td>∫ … dx</td><td>Add up over a continuous range: a sum over infinitely many thin slices.</td></tr>
  <tr><td>P(A)</td><td>Probability of A, a number from 0 to 1.</td></tr>
  <tr><td>P(A | B)</td><td>Probability of A among only the cases where B happened.</td></tr>
  <tr><td>∩, ∪</td><td>“and”, “or”.</td></tr>
  <tr><td>λ</td><td>A rate: events per hour.</td></tr>
  <tr><td>x<sub>k</sub>, x<sup>U</sup>, x<sup>*</sup>, x̂</td><td>Type k; upper bound; allowed value; estimate from data.</td></tr>
  <tr><td>e<sup>x</sup>, ln x</td><td>Exponential and its inverse. e⁻³ ≈ 0.05; ln 20 ≈ 3.</td></tr>
  <tr><td>∝, ≈, ⇒</td><td>“proportional to”, “approximately”, “therefore”.</td></tr>
  <tr><td>χ², Φ</td><td>Table values: the chi-square quantile and the bell-curve tail. You look them up; you never compute them by hand.</td></tr>
  </table>
  <h3>Learn the maths in this order</h3><p>Each foundation card has a step-by-step lesson that starts from school maths, a worked robotaxi example and a question to check yourself.</p>
  <div class="mpath">${MATHPATH.map((m,i)=>`<button class="prelink" data-go="${m}">${i+1} · ${byId[m].t}</button>`).join("")}</div>
  <p style="display:flex;gap:8px;flex-wrap:wrap"><button class="solid" id="primerTour">Start the guided tour</button><button id="primerMath">Walk the maths path</button></p></div>`;
  document.getElementById("tourBar").hidden=true;panel.hidden=false;document.getElementById("hint").hidden=true;
  document.getElementById("primerTour").addEventListener("click",()=>{ACT=TOUR;tourIdx=0;select(ACT[0]);});
  document.getElementById("primerMath").addEventListener("click",()=>{ACT=MATHPATH;tourIdx=0;select(ACT[0]);});
}
function clearSel(){selected=null;tourIdx=-1;panel.hidden=true;clearHi();}
document.getElementById("pBody").addEventListener("click",ev=>{const b=ev.target.closest("[data-go]");if(b){tourIdx=-1;select(b.dataset.go);}});
document.getElementById("pClose").addEventListener("click",clearSel);
document.getElementById("keyBtn").addEventListener("click",showKey);
document.getElementById("startBtn").addEventListener("click",showPrimer);
document.getElementById("tourBtn").addEventListener("click",()=>{ACT=TOUR;tourIdx=0;select(ACT[0]);});
document.getElementById("tourNext").addEventListener("click",()=>{if(tourIdx>=ACT.length-1){clearSel();fit();return;}tourIdx++;select(ACT[tourIdx]);});
document.getElementById("tourPrev").addEventListener("click",()=>{if(tourIdx>0){tourIdx--;select(ACT[tourIdx]);}});
document.getElementById("fitBtn").addEventListener("click",()=>fit());
const exBtn=document.getElementById("exBtn"),mathBtn=document.getElementById("mathBtn");
exBtn.addEventListener("click",()=>{const on=exBtn.getAttribute("aria-pressed")!=="true";exBtn.setAttribute("aria-pressed",on);world.classList.toggle("ex",on);layout();if(selected)select(selected,{fly:false});});
mathBtn.addEventListener("click",()=>{const on=mathBtn.getAttribute("aria-pressed")!=="true";mathBtn.setAttribute("aria-pressed",on);world.classList.toggle("nomath",!on);});
document.getElementById("zoomIn").addEventListener("click",()=>{const r=stage.getBoundingClientRect();zoomAt(1.25,r.width/2,r.height/2);});
document.getElementById("zoomOut").addEventListener("click",()=>{const r=stage.getBoundingClientRect();zoomAt(0.8,r.width/2,r.height/2);});
world.addEventListener("keydown",ev=>{const nd=ev.target.closest&&ev.target.closest(".node");if(nd&&(ev.key==="Enter"||ev.key===" ")){ev.preventDefault();tourIdx=-1;select(nd.dataset.id);}});

/* ---------- pointer: pan, pinch, tap ---------- */
const ptrs=new Map();let down=null,moved=false,pinch=null;
stage.addEventListener("pointerdown",ev=>{if(ev.target.closest(".panel"))return;stage.setPointerCapture(ev.pointerId);ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptrs.size===1){down={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y,target:ev.target};moved=false;}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s:view.s};moved=true;}cancelAnimationFrame(animId);});
stage.addEventListener("pointermove",ev=>{if(!ptrs.has(ev.pointerId))return;ptrs.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const r=stage.getBoundingClientRect();zoomAt(clampS(pinch.s*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d)/view.s,(a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top);return;}
  if(down&&ptrs.size===1){const dx=ev.clientX-down.x,dy=ev.clientY-down.y;if(!moved&&Math.hypot(dx,dy)>5){moved=true;stage.classList.add("drag");}if(moved){view.x=down.vx+dx;view.y=down.vy+dy;apply();}}});
function up(ev){if(!ptrs.has(ev.pointerId))return;ptrs.delete(ev.pointerId);
  if(ptrs.size===0){stage.classList.remove("drag");if(down&&!moved){const nd=down.target.closest&&down.target.closest(".node");if(nd){tourIdx=-1;select(nd.dataset.id);}else if(!panel.hidden)clearSel();}down=null;pinch=null;}
  else{const [p]=[...ptrs.values()];down={x:p.x,y:p.y,vx:view.x,vy:view.y,target:stage};pinch=null;}}
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
stage.addEventListener("wheel",ev=>{if(ev.target.closest(".panel"))return;ev.preventDefault();const r=stage.getBoundingClientRect();
  const mouseWheel=ev.deltaMode!==0||(ev.deltaX===0&&Math.abs(ev.deltaY)>=40&&Number.isInteger(ev.deltaY));
  if(ev.ctrlKey||mouseWheel)zoomAt(Math.exp(-ev.deltaY*(ev.ctrlKey?0.01:0.0018)),ev.clientX-r.left,ev.clientY-r.top);else{view.x-=ev.deltaX;view.y-=ev.deltaY;apply();}},{passive:false});

layout();fit(false);
function fromHash(){const h=location.hash.slice(1).replace(/-/g,"_");if(byId[h]){tourIdx=-1;select(h);return true;}return false;}
addEventListener("hashchange",fromHash);
let seen=false;try{seen=localStorage.getItem("atlas-primer-seen")==="1";localStorage.setItem("atlas-primer-seen","1");}catch(e){}
if(!fromHash()&&!seen){showPrimer();fit(false);}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>{layout();if(!selected)fit(false);});
addEventListener("resize",()=>{if(panel.hidden)fit(false);});
</script>

</body></html>
